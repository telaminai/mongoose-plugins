<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mongoose Admin</title>
    <link rel="stylesheet" href="/style.css">
    <!--
        IMPORTANT load order:
        1. app.js loads EAGERLY (no defer) so it attaches the `alpine:init`
           listener before Alpine's deferred script runs. Alpine's CDN build
           calls Alpine.start() during its own script execution, not on
           DOMContentLoaded, so any listener attached after Alpine loads is
           too late.
        2. htmx + Alpine load with defer.
    -->
    <script src="/app.js"></script>
    <script src="/vendor/htmx-2.0.4.min.js" defer></script>
    <script src="/vendor/alpine-3.14.8.min.js" defer></script>
</head>
<body x-data="adminApp()" x-init="boot()" x-cloak>

<header class="topbar">
    <div class="brand">Mongoose Admin</div>
    <div class="auth-state">
        <template x-if="authed">
            <span>
                <span class="user" x-text="userId"></span>
                <button class="link" @click="logout()">log out</button>
            </span>
        </template>
        <template x-if="!authed && authMode !== 'NONE'">
            <span class="muted">not authenticated</span>
        </template>
        <template x-if="authMode === 'NONE'">
            <span class="warn">auth disabled — local dev only</span>
        </template>
    </div>
</header>

<main x-show="authed || authMode === 'NONE'">
    <section class="commands">
        <h2>Commands</h2>
        <input type="search" placeholder="filter…" x-model="filter" class="filter">
        <ul class="cmd-list">
            <template x-for="cmd in filteredCommands()" :key="cmd">
                <li>
                    <button class="cmd" :class="{ active: selected === cmd }" @click="select(cmd)" x-text="cmd"></button>
                </li>
            </template>
            <template x-if="commands.length === 0">
                <li class="muted">no commands registered</li>
            </template>
        </ul>
    </section>

    <section class="runner">
        <h2>
            <span x-text="selected || 'select a command'"></span>
        </h2>
        <form @submit.prevent="invoke()">
            <label>arguments (one per line)</label>
            <textarea x-model="argsText" rows="3" placeholder=""></textarea>
            <button type="submit" :disabled="!selected || running">
                <span x-show="!running">run</span>
                <span x-show="running">running…</span>
            </button>
        </form>

        <section class="result" x-show="lastResult">
            <h3>result</h3>
            <pre class="out" x-show="lastResult?.output?.length"><template x-for="line in lastResult?.output ?? []" :key="line"><span x-text="line + '\n'"></span></template></pre>
            <pre class="err" x-show="lastResult?.err?.length"><template x-for="line in lastResult?.err ?? []" :key="line"><span x-text="line + '\n'"></span></template></pre>
            <p class="muted" x-show="lastResult?.output?.length === 0 && lastResult?.err?.length === 0">(no output)</p>
        </section>

        <section class="history" x-show="history.length">
            <h3>history</h3>
            <ul>
                <template x-for="(h, i) in history" :key="i">
                    <li>
                        <button class="link" @click="replay(h)" x-text="h.command + (h.args.length ? ' ' + h.args.join(' ') : '')"></button>
                    </li>
                </template>
            </ul>
        </section>
    </section>
</main>

<section class="login" x-show="!authed && authMode !== 'NONE'">
    <h2>Sign in</h2>
    <form @submit.prevent="login()">
        <template x-if="authMode === 'BASIC' || authMode === 'unknown'">
            <div>
                <label>username</label>
                <input type="text" x-model="loginUser" autocomplete="username" required>
                <label>password</label>
                <input type="password" x-model="loginPass" autocomplete="current-password" required>
            </div>
        </template>
        <template x-if="authMode === 'BEARER'">
            <div>
                <label>bearer token</label>
                <input type="password" x-model="loginToken" required>
            </div>
        </template>
        <button type="submit">sign in</button>
        <p class="err" x-text="loginError" x-show="loginError"></p>
    </form>
</section>

</body>
</html>
