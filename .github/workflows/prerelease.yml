name: Publish qualified plugin release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing qualified release tag (local publication must not be repeated)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: prerelease-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.release_tag }}
      - name: Verify exact release version
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python3 - <<'PYTHON'
          import os, re, xml.etree.ElementTree as ET
          version = ET.parse('pom.xml').getroot().find('{http://maven.apache.org/POM/4.0.0}version').text
          assert re.fullmatch(r'\d+\.\d+\.\d+(?:\.\d+)?(?:-rc\d+)?', version), version
          assert os.environ['RELEASE_TAG'] == 'v' + version, 'tag/POM mismatch'
          PYTHON
          git log -1 --format='%H %s'
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'adopt'
          server-id: repsy-fluxtion
          server-username: MAVEN_USERNAME
          server-password: MAVEN_CENTRAL_TOKEN
      - name: Publish the tagged reactor to Repsy
        run: ./mvnw -B -ntp -Dmaven.test.redirectTestOutputToFile=true clean deploy
        env:
          MAVEN_USERNAME: ${{ secrets.REPSY_USER }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.REPSY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prerelease-test-reports
          path: '**/target/surefire-reports/'
