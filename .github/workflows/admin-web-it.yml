name: admin-web failure-scenario packs

# REST + UI regression packs for svc-admin-web against the Mongoose control plane
# (service/svc-admin-web/docs/testing-admin-web-it.md). Manual only for now. It runs against the
# reactor's released Mongoose (1.0.33), resolved from the public repository.
on:
  workflow_dispatch:
    inputs:
      run_proposed:
        description: also run the "proposed" tests (expected to fail until the proposal lands; never gates)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  admin-web-it:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout plugins
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-1.49.0

      - name: Install Chromium and its OS dependencies
        run: |
          mvn -B -q -pl service/svc-admin-web -am install -DskipTests
          mvn -B -q -Padmin-web-it -pl service/svc-admin-web exec:java -Dexec.classpathScope=test \
            -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install --with-deps chromium"

      - name: Unit suite + REST and UI packs
        run: mvn -B -Padmin-web-it verify -pl service/svc-admin-rest,service/svc-admin-web

      - name: Proposed behaviour (informational)
        if: ${{ inputs.run_proposed }}
        continue-on-error: true
        run: >
          mvn -B -Padmin-web-it verify -pl service/svc-admin-web -Dtest=NONE -Dsurefire.failIfNoSpecifiedTests=false
          -Dit.groups=proposed -Dit.excludedGroups=none

      - name: Upload screenshots, traces and REST actuals
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-web-it-artifacts
          path: |
            service/svc-admin-web/target/admin-web-it/
            service/svc-admin-web/target/failsafe-reports/
            service/svc-admin-web/target/surefire-reports/
          if-no-files-found: warn
          retention-days: 14
