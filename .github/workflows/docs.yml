name: Deploy docs

on:
  push:
    branches: [ main, docs, release, develop ]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'docs-requirements.txt'
      - '.github/workflows/docs.yml'
      # regenerate the config-reference + schema.json when the generator,
      # its index/overrides, or the reflected plugin config classes change
      - 'tooling/config-schema-gen/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
#  deploy:
#    runs-on: ubuntu-latest
#    steps:
#      - uses: actions/checkout@v4
#        with:
#          fetch-depth: 0
#
#      - uses: actions/setup-python@v5
#        with:
#          python-version: '3.x'
#          cache: pip
#          cache-dependency-path: docs-requirements.txt
#
#      - name: Install MkDocs + Material
#        run: pip install -r docs-requirements.txt
#
#      - name: Build site
#        run: mkdocs build --strict
#
#      - name: Deploy to gh-pages
#        run: mkdocs gh-deploy --force

  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: docs-requirements.txt

      - name: Install MkDocs + Material
        run: pip install -r docs-requirements.txt

      - name: Install dependencies
        run: |
          pip install mkdocs mkdocs-macros-plugin mkdocs-material mkdocs-mermaid2-plugin mkdocs-awesome-pages-plugin

      # Regenerate the machine-readable schema.json + the human config-reference
      # page from the live plugin config classes, so the deployed site is always
      # current (the committed copies are a fallback / for local viewing).
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Regenerate config schema + reference
        run: |
          VERSION=$(mvn -q -N help:evaluate -Dexpression=project.version -DforceStdout)
          echo "Regenerating config schema for mongoose-plugins $VERSION"
          mvn -q -pl tooling/config-schema-gen -am install -DskipTests
          mvn -q -pl tooling/config-schema-gen \
            org.codehaus.mojo:exec-maven-plugin:3.3.0:java \
            -Dexec.mainClass=com.telamin.mongoose.tooling.schemagen.SchemaGenMain \
            -Dexec.args="$VERSION target/schema-out docs"

      - name: Build site
        run: mkdocs build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  # Deployment job
  deploy-gh:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4